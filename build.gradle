plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

compileJava {
    options.compilerArgs += ['-h', "${projectDir}/src/main/native/include"]
    outputs.upToDateWhen { false }
}

loom {
    accessWidenerPath = file("src/main/resources/radiance.accesswidener")
}

tasks.named("runClient", JavaExec) {
   args "--width", "1920", "--height", "1080"
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "Mojang"
        url = "https://libraries.minecraft.net/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    mavenCentral()
}

dependencies {
    // To change the versions see the gradle.properties file
    // Minecraft 26.2 is shipped de-obfuscated (official Mojang names), so no
    // "mappings" / yarn dependency is declared -- Loom performs no remapping.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Sodium + Iris (from Modrinth) for the target render environment.
    // Minecraft 26.2 is de-obfuscated, so Loom performs no mod remapping and the
    // legacy "modImplementation" configuration is gone -- plain implementation is used.
    implementation "maven.modrinth:sodium:${project.sodium_version}"
    implementation "maven.modrinth:iris:${project.iris_version}"

    // https://mvnrepository.com/artifact/org.yaml/snakeyaml
    implementation "org.yaml:snakeyaml:2.5"
    include "org.yaml:snakeyaml:2.5"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    // Raise the error cap so the in-progress 1.21.4 -> 26.2 source migration shows
    // every diagnostic in one pass instead of stopping at the default 100.
    it.options.compilerArgs += ["-Xmaxerrs", "2000", "-Xmaxwarns", "2000"]
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

// Minecraft 26.2 is de-obfuscated: Loom performs no remapping, so there is no
// "remapJar"/"remapSourcesJar" task -- the "jar" and "sourcesJar" tasks produce
// the final artifacts directly.
jar {
    archiveFileName.set("${project.archives_base_name}-${project.version}-fabric-${project.minecraft_version}.jar")
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

tasks.named("sourcesJar") {
    archiveFileName.set("${project.archives_base_name}-${project.version}-fabric-${project.minecraft_version}-sources.jar")
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
